<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>元素獵人 | Chem ARPG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #090d16; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    #app { display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto; }
    /* HUD bar */
    .hud { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; z-index: 5; }
    .bar { height: 14px; border-radius: 7px; overflow: hidden; background: #1e293b; flex: 1; min-width: 60px; }
    .bar-fill { height: 100%; border-radius: 7px; transition: width 0.2s; }
    .bar-hp .bar-fill { background: linear-gradient(90deg, #dc2626, #ef4444); }
    .bar-mp .bar-fill { background: linear-gradient(90deg, #2563eb, #3b82f6); }
    .hud-label { color: #94a3b8; font-size: 11px; }
    .hud-val { color: #38bdf8; }
    /* Element bar */
    .elem-bar { flex-wrap: wrap; padding: 4px 12px; background: #0b1120; border-bottom: 1px solid #1e293b;
      display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; z-index: 5; }
    .elem-slot { color: #f8fafc; font: inherit; cursor: pointer; touch-action: manipulation; padding: 2px 8px; border-radius: 6px; background: #1e293b; border: 1px solid #334155; }
    .elem-slot.active { border-color: #fbbf24; background: #332800; }
    /* Canvas area */
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    canvas#game { background: #0f172a; border-radius: 4px; touch-action: none; image-rendering: pixelated; }
    /* Mobile controls */
    .controls { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #0f172a;
      border-top: 1px solid #1e293b; display: flex; gap: 8px; z-index: 5; }
    .ctrl-left { display: none; align-items: center; justify-content: center; width: 120px; height: 120px; position: relative; }
    .ctrl-right { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; margin-left: auto; }
    .abtn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #334155; background: #1e293b;
      color: #f8fafc; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; }
    .abtn:active { background: #334155; }
    .abtn.atk { border-color: #ef4444; background: #450a0a; }
    .abtn.shoot { border-color: #3b82f6; background: #172554; }
    .skill-row { display: flex; gap: 4px; }
    .skill-btn { min-width: 48px; padding: 4px; height: 44px; border-radius: 10px; border: 1px solid #334155; background: #1e293b;
      color: #94a3b8; font-size: 11px; font-weight: 700; touch-action: manipulation; }
    .menu-btn { padding: 8px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b;
      color: #fbbf24; font-size: 12px; font-weight: 700; touch-action: manipulation; }
    .skill-btn.selected { border-color: #fbbf24; background: #332800; box-shadow: 0 0 0 1px #fbbf24; }
    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(2,6,23,0.85); z-index: 50;
      display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-card { background: #0f172a; border: 1px solid #334155; border-radius: 20px;
      padding: 20px; width: 100%; max-width: 420px; max-height: 80dvh; overflow-y: auto; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #334155; background: #1e293b;
      color: #94a3b8; font-size: 13px; font-weight: 700; text-align: center; }
    .tab-btn.active { background: #334155; color: #f8fafc; border-color: #38bdf8; }
    .recipe-row { display: flex; justify-content: space-between; align-items: center;
      padding: 10px; background: #1e293b; border-radius: 10px; margin-bottom: 6px; font-size: 13px; }
    .recipe-row.locked { opacity: 0.4; }
    .synth-btn { padding: 8px 16px; border-radius: 10px; border: none; background: #059669; color: #fff;
      font-weight: 700; font-size: 13px; }
    .synth-btn:disabled { background: #334155; color: #64748b; }
    /* Title screen */
    .title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100dvh; gap: 16px; text-align: center; padding: 24px; }
    .title-screen h1 { font-size: 32px; font-weight: 900; }
    .title-screen .start-btn { padding: 14px 40px; border-radius: 14px; border: none;
      background: linear-gradient(90deg, #0284c7, #2563eb); color: #fff; font-size: 18px; font-weight: 800; }
    .title-screen .sub-btn { padding: 10px 24px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #94a3b8; font-size: 14px; font-weight: 700; }
    /* Toast */
    #toast { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(90deg, #059669, #10b981); color: #fff; padding: 6px 16px;
      border-radius: 999px; font-weight: 800; font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 20; white-space: nowrap; box-shadow: 0 6px 15px rgba(16,185,129,0.4); }
    #toast.show { opacity: 1; }
    /* Desktop: hide mobile controls */
    @media (hover: none) and (pointer: coarse) { .ctrl-left { display: flex; } }
  </style>
</head>
<body>
<div id="app">
  <!-- Title Screen -->
  <div class="title-screen" id="title-screen">
    <div style="font-size:64px;">⚗️</div>
    <h1>元素獵人</h1>
    <p style="color:#94a3b8;font-size:14px;">化學元素 ARPG — 收集元素、合成化合物、探索隨機地牢</p>
    <div id="title-stats" style="color:#64748b;font-size:12px;"></div>
    <button class="start-btn" id="btn-start">出發探索</button>
    <div style="display:flex;gap:8px;">
      <button class="sub-btn" id="btn-title-codex">圖鑑</button>
      <button class="sub-btn" id="btn-title-status">角色狀態</button>
    </div>
  </div>
  <!-- Game Screen -->
  <div id="game-screen" style="display:none;flex-direction:column;height:100dvh;">
    <div class="hud" id="hud">
      <span class="hud-label">HP</span>
      <div class="bar bar-hp"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
      <span class="hud-label">MP</span>
      <div class="bar bar-mp"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div>
      <span>Lv.<span class="hud-val" id="hud-lv">1</span></span>
      <button class="menu-btn" id="btn-menu">選單</button>
    </div>
    <div class="elem-bar" id="elem-bar"></div>
    <div class="stage" id="stage">
      <div id="toast"></div>
      <canvas id="game"></canvas>
    </div>
    <div class="controls" id="mobile-controls">
      <div class="ctrl-left"><canvas id="joystick" width="120" height="120"></canvas></div>
      <div class="ctrl-right">
        <div class="skill-row">
          <button class="skill-btn" id="sk1">技1</button>
          <button class="skill-btn" id="sk2">技2</button>
          <button class="skill-btn" id="sk3">技3</button>
          <button class="skill-btn" id="sk4">技4</button>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="abtn atk" id="btn-atk">⚔️</button>
          <button class="abtn shoot" id="btn-shoot" title="發射元素彈（點擊上方元素欄切換彈藥）" aria-label="發射元素彈">🔵</button>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Menu Modal -->
<div class="modal" id="menu-modal">
  <div class="modal-card">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="inv">背包</button>
      <button class="tab-btn" data-tab="codex">圖鑑</button>
      <button class="tab-btn" data-tab="status">狀態</button>
      <button class="tab-btn" data-tab="help">操作</button>
    </div>
    <div id="tab-inv"></div>
    <div id="tab-codex" style="display:none"></div>
    <div id="tab-status" style="display:none"></div>
    <div id="tab-help" style="display:none"></div>
    <button class="menu-btn" id="btn-close-menu" style="width:100%;margin-top:12px;">關閉</button>
  </div>
</div>
<!-- Death Modal -->
<div class="modal" id="death-modal">
  <div class="modal-card" style="text-align:center;">
    <h2 style="margin-bottom:8px;">💀 實驗失敗...</h2>
    <p style="color:#94a3b8;margin-bottom:16px;">你在探索中倒下了，但收集到的元素與經驗已保存。</p>
    <button class="start-btn" id="btn-death-return" style="font-size:15px;padding:12px 30px;">返回大廳</button>
  </div>
</div>
<!-- Victory Modal -->
<div class="modal" id="victory-modal">
  <div class="modal-card" style="text-align:center;">
    <h2 style="margin-bottom:8px;">🏆 Boss 擊敗！</h2>
    <p style="color:#94a3b8;" id="victory-summary"></p>
    <button class="start-btn" id="btn-victory-return" style="font-size:15px;padding:12px 30px;margin-top:16px;">返回大廳</button>
  </div>
</div>
<script>
(() => {
  'use strict';
  // === CONSTANTS ===
  const COLS = 16, ROWS = 12, MAP_W = 5, MAP_H = 5;
  const TILE = { FLOOR: 0, WALL: 1, ROCK: 2, GRASS: 3, WATER: 4 };
  const TILE_COLORS = {
    [TILE.FLOOR]: '#131c31', [TILE.WALL]: '#334155', [TILE.ROCK]: '#475569',
    [TILE.GRASS]: '#14532d', [TILE.WATER]: '#0c4a6e'
  };
  const ELEMENTS = [
    { sym: 'H', name: '氫', color: '#0284c7', speed: 7, dmgMul: 0.6, fx: null },
    { sym: 'O', name: '氧', color: '#dc2626', speed: 5, dmgMul: 1.0, fx: null },
    { sym: 'C', name: '碳', color: '#475569', speed: 3.5, dmgMul: 1.5, fx: null },
    { sym: 'Na', name: '鈉', color: '#7c3aed', speed: 5, dmgMul: 0.8, fx: 'knockback' },
    { sym: 'Cl', name: '氯', color: '#059669', speed: 5, dmgMul: 0.8, fx: 'dot' },
    { sym: 'Ca', name: '鈣', color: '#d97706', speed: 3.5, dmgMul: 1.2, fx: 'pierce' }
  ];
  const RECIPES = [
    { id: 'H2O', formula: 'H₂O', name: '淨化之水', req: { H: 2, O: 1 }, pts: 200, mp: 15, skill: 'heal',
      desc: '回復 30% 最大 HP' },
    { id: 'NaCl', formula: 'NaCl', name: '結晶爆破', req: { Na: 1, Cl: 1 }, pts: 150, mp: 20, skill: 'aoe',
      desc: '周圍 3 格範圍傷害' },
    { id: 'CO2', formula: 'CO₂', name: '煙霧彈', req: { C: 1, O: 2 }, pts: 200, mp: 15, skill: 'smoke',
      desc: '3 秒內周圍怪物停止追蹤' },
    { id: 'NaOH', formula: 'NaOH', name: '腐蝕陷阱', req: { Na: 1, O: 1, H: 1 }, pts: 280, mp: 25, skill: 'trap',
      desc: '放置陷阱，怪物踩到持續扣血' },
    { id: 'CaCO3', formula: 'CaCO₃', name: '石盾', req: { Ca: 1, C: 1, O: 3 }, pts: 450, mp: 30, skill: 'shield',
      desc: '2 秒無敵' },
    { id: 'CH4', formula: 'CH₄', name: '甲烷爆炸', req: { C: 1, H: 4 }, pts: 380, mp: 40, skill: 'explode',
      desc: '大範圍高傷害（5 格半徑）' },
    { id: 'CaCl2', formula: 'CaCl₂', name: '急凍結晶', req: { Ca: 1, Cl: 2 }, pts: 240, mp: 25, skill: 'freeze',
      desc: '凍結周圍怪物 2 秒' },
    { id: 'HClO', formula: 'HClO', name: '酸霧', req: { H: 1, Cl: 1, O: 1 }, pts: 220, mp: 20, skill: 'acid',
      desc: '前方錐形持續傷害 3 秒' }
  ];

  // === MAP ===
  let rooms = [];

  function generateMap() {
    rooms = Array.from({ length: MAP_H }, () => Array.from({ length: MAP_W }, () => ({
      tiles: [], type: 'normal', generated: false, monsters: [], drops: [], cleared: false
    })));
    // Start room at center
    rooms[2][2].type = 'start';
    // Boss room on a random edge
    const edges = [];
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
      if (x === 0 || x === MAP_W - 1 || y === 0 || y === MAP_H - 1) {
        if (!(x === 2 && y === 2)) edges.push([x, y]);
      }
    }
    const [bx, by] = edges[Math.floor(Math.random() * edges.length)];
    rooms[by][bx].type = 'boss';
    // 2-3 treasure rooms (not start, not boss)
    let treasureCount = 0;
    const target = 2 + Math.floor(Math.random() * 2);
    while (treasureCount < target) {
      const tx = Math.floor(Math.random() * MAP_W);
      const ty = Math.floor(Math.random() * MAP_H);
      if (rooms[ty][tx].type === 'normal') {
        rooms[ty][tx].type = 'treasure';
        treasureCount++;
      }
    }
  }

  function generateRoom(mx, my) {
    const room = rooms[my][mx];
    if (room.generated) return;
    room.generated = true;
    const tiles = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE.FLOOR));
    // Border walls (leave exits open at center of each side)
    for (let c = 0; c < COLS; c++) { tiles[0][c] = TILE.WALL; tiles[ROWS - 1][c] = TILE.WALL; }
    for (let r = 0; r < ROWS; r++) { tiles[r][0] = TILE.WALL; tiles[r][COLS - 1] = TILE.WALL; }
    // Exits: 2-tile wide openings at center of each border if adjacent room exists
    if (my > 0) { tiles[0][7] = TILE.FLOOR; tiles[0][8] = TILE.FLOOR; }
    if (my < MAP_H - 1) { tiles[ROWS - 1][7] = TILE.FLOOR; tiles[ROWS - 1][8] = TILE.FLOOR; }
    if (mx > 0) { tiles[5][0] = TILE.FLOOR; tiles[6][0] = TILE.FLOOR; }
    if (mx < MAP_W - 1) { tiles[5][COLS - 1] = TILE.FLOOR; tiles[6][COLS - 1] = TILE.FLOOR; }
    // Random terrain for non-start rooms
    if (room.type !== 'start') {
      const obstacleCount = 8 + Math.floor(Math.random() * 12);
      for (let i = 0; i < obstacleCount; i++) {
        const r = 2 + Math.floor(Math.random() * (ROWS - 4));
        const c = 2 + Math.floor(Math.random() * (COLS - 4));
        if (tiles[r][c] === TILE.FLOOR) {
          const types = [TILE.ROCK, TILE.ROCK, TILE.GRASS, TILE.GRASS, TILE.WATER, TILE.WALL];
          tiles[r][c] = types[Math.floor(Math.random() * types.length)];
        }
      }
    }
    room.tiles = tiles;
    spawnMonsters(room, mx, my);
  }

  function drawRoom() {
    const room = rooms[state.mapY][state.mapX];
    if (!room || !room.generated) return;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = room.tiles[r][c];
        const x = c * tileSize, y = r * tileSize;
        const horiz = r === 0 || r === ROWS - 1;
        const vert = c === 0 || c === COLS - 1;
        const border = horiz || vert;
        const edgeAngle = r === ROWS - 1 ? Math.PI
          : c === 0 ? -Math.PI / 2 : c === COLS - 1 ? Math.PI / 2 : 0;
        // Keep the random room layout and all collisions driven by room.tiles.
        const variant = ((r * 17 + c * 13 + state.mapX * 7 + state.mapY) % 11) < 3 ? 1 : 0;
        const baseDrawn = drawArt(terrainArt, variant, x, y, tileSize, tileSize);
        if (baseDrawn) {
          switch (t) {
            case TILE.FLOOR:
              if (border) drawTerrainDetail(6, x, y, edgeAngle);
              break;
            case TILE.WALL:
              if (horiz && vert) drawTerrainDetail(7, x, y);
              else drawTerrainDetail(2, x, y, edgeAngle);
              break;
            case TILE.ROCK: drawTerrainDetail(3, x, y); break;
            case TILE.GRASS: drawTerrainDetail(4, x, y); break;
            case TILE.WATER: drawTerrainDetail(5, x, y); break;
          }
        } else {
          ctx.fillStyle = TILE_COLORS[t];
          ctx.fillRect(x, y, tileSize, tileSize);
          ctx.strokeStyle = 'rgba(30,41,59,0.4)';
          ctx.lineWidth = 0.5;
          ctx.strokeRect(x, y, tileSize, tileSize);
        }
      }
    }
  }

  function transitionRoom(dx, dy) {
    const nx = state.mapX + dx;
    const ny = state.mapY + dy;
    if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return false;
    state.mapX = nx;
    state.mapY = ny;
    generateRoom(nx, ny);
    // Clear room-local effects
    projectiles = [];
    traps = [];
    acidZones = [];
    smokeTimer = 0;
    castVisuals = [];
    return true;
  }

  // === PLAYER ===
  let player = { x: 0, y: 0, dir: 'down', hp: 50, maxHp: 50, mp: 20, maxMp: 20,
    atk: 5, level: 1, exp: 0, speed: 4.5,
    atkTimer: 0, attackDir: 'down', shotTimer: 0, invincible: 0, shieldTimer: 0 };

  const keys = { up: false, down: false, left: false, right: false, attack: false, shoot: false };

  function initPlayer() {
    player.x = 7.5; player.y = 6;
    player.dir = 'down';
    player.hp = player.maxHp;
    player.mp = player.maxMp;
    player.atkTimer = 0;
    player.attackDir = player.dir;
    player.shotTimer = 0;
    castVisuals = [];
    player.invincible = 0;
    player.shieldTimer = 0;
  }

  function isSolid(col, row) {
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return true;
    const t = rooms[state.mapY][state.mapX].tiles[row][col];
    return t === TILE.WALL || t === TILE.ROCK || t === TILE.WATER;
  }

  function updatePlayer(dt) {
    let dx = 0, dy = 0;
    if (keys.up) { dy = -1; player.dir = 'up'; }
    if (keys.down) { dy = 1; player.dir = 'down'; }
    if (keys.left) { dx = -1; player.dir = 'left'; }
    if (keys.right) { dx = 1; player.dir = 'right'; }
    // Normalize diagonal
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    const spd = player.speed * dt;
    const nx = player.x + dx * spd;
    const ny = player.y + dy * spd;
    const halfW = 0.35;
    // X collision
    if (dx !== 0) {
      const testX = dx > 0 ? nx + halfW : nx - halfW;
      if (!isSolid(Math.floor(testX), Math.floor(player.y - halfW)) &&
          !isSolid(Math.floor(testX), Math.floor(player.y + halfW - 0.01))) {
        player.x = nx;
      }
    }
    // Y collision
    if (dy !== 0) {
      const testY = dy > 0 ? ny + halfW : ny - halfW;
      if (!isSolid(Math.floor(player.x - halfW), Math.floor(testY)) &&
          !isSolid(Math.floor(player.x + halfW - 0.01), Math.floor(testY))) {
        player.y = ny;
      }
    }
    // Room transition — check player is at an exit tile and near the edge
    const pc = Math.floor(player.x), pr = Math.floor(player.y);
    if (player.x < 0.5 && (pr === 5 || pr === 6)) {
      if (transitionRoom(-1, 0)) player.x = COLS - 1.5;
    } else if (player.x > COLS - 0.5 && (pr === 5 || pr === 6)) {
      if (transitionRoom(1, 0)) player.x = 1.5;
    } else if (player.y < 0.5 && (pc === 7 || pc === 8)) {
      if (transitionRoom(0, -1)) player.y = ROWS - 1.5;
    } else if (player.y > ROWS - 0.5 && (pc === 7 || pc === 8)) {
      if (transitionRoom(0, 1)) player.y = 1.5;
    }
    // Timers
    if (player.atkTimer > 0) player.atkTimer -= dt;
    if (player.shotTimer > 0) player.shotTimer -= dt;
    if (player.invincible > 0) player.invincible -= dt;
    if (player.shieldTimer > 0) player.shieldTimer -= dt;
  }

  const DIR_ARROWS = { up: '▲', down: '▼', left: '◀', right: '▶' };
  const DIR_FRAME = { down: 0, left: 1, right: 2, up: 3 };
  const DIR_ANGLE = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };
  const AMMO_FRAME = { H: 1, O: 2, C: 3, Na: 4, Cl: 5, Ca: 6 };

  function drawPlayer() {
    const px = Math.round(player.x * tileSize);
    const py = Math.round(player.y * tileSize);
    const swinging = player.atkTimer > 0.15;
    const dir = swinging ? player.attackDir : player.dir;
    const frame = swinging ? (player.atkTimer > 0.25 ? 1 : 2) : player.shotTimer > 0 ? 1 : 0;
    const scale = tileSize / 32;
    const flashing = player.invincible > 0 && Math.floor(player.invincible * 16) % 2 !== 0;
    ctx.save();
    if (flashing) ctx.globalAlpha = 0.55;
    const drawn = drawArt(heroArt, frame * 4 + DIR_FRAME[dir],
      px - 20 * scale, py - 26 * scale, 40 * scale, 40 * scale);
    ctx.restore();
    if (!drawn) {
      const s = tileSize * 0.8;
      ctx.fillStyle = flashing ? '#fbbf24' : '#38bdf8';
      ctx.fillRect(px - s / 2, py - s / 2, s, s);
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${tileSize * 0.4}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(DIR_ARROWS[dir], px, py);
    }
    if (swinging && (!drawn || frame === 2)) {
      const angle = DIR_ANGLE[dir];
      const painted = drawCombat(0, px + Math.cos(angle) * tileSize * 0.95,
        py + Math.sin(angle) * tileSize * 0.95, tileSize * 1.45, angle);
      if (!painted) {
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(px, py, tileSize * 1.5, angle - 0.6, angle + 0.6);
        ctx.stroke();
      }
    }
  }

  // === CANVAS SETUP ===
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const WORLD_ZOOM = 2;
  let tileSize = 32;

  function loadArt(file, cell, cols, rows) {
    const img = new Image();
    img.src = 'assets/chem-arpg/' + file;
    return { img, cell, cols, rows };
  }

  const terrainArt = loadArt('terrain.png', 32, 8, 1);
  const heroArt = loadArt('hero.png', 40, 4, 3);
  const combatArt = loadArt('combat.png', 48, 4, 3);

  function drawArt(art, frame, x, y, w, h) {
    const { img, cell, cols, rows } = art;
    if (img.naturalWidth !== cell * cols || img.naturalHeight !== cell * rows) return false;
    ctx.drawImage(img, (frame % cols) * cell, Math.floor(frame / cols) * cell, cell, cell,
      Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
    return true;
  }

  function drawTerrainDetail(frame, x, y, angle = 0) {
    if (!angle) return drawArt(terrainArt, frame, x, y, tileSize, tileSize);
    ctx.save();
    ctx.translate(x + tileSize / 2, y + tileSize / 2);
    ctx.rotate(angle);
    // Keep rotated odd-size tiles aligned with the underlying pixel grid.
    const { img, cell } = terrainArt;
    ctx.drawImage(img, frame * cell, 0, cell, cell, -tileSize / 2, -tileSize / 2, tileSize, tileSize);
    ctx.restore();
    return true;
  }

  function drawCombat(frame, x, y, size, angle = 0, opacity = 1) {
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    if (angle) ctx.rotate(angle);
    ctx.globalAlpha *= opacity;
    const rendered = drawArt(combatArt, frame, -size / 2, -size / 2, size, size);
    ctx.restore();
    return rendered;
  }

  function resizeCanvas() {
    const stage = document.getElementById('stage');
    const maxW = stage.clientWidth - 8;
    const maxH = stage.clientHeight - 8;
    const fittedTileSize = Math.max(1, Math.floor(Math.min(maxW / COLS, maxH / ROWS)));
    tileSize = fittedTileSize * WORLD_ZOOM;
    canvas.width = fittedTileSize * COLS;
    canvas.height = fittedTileSize * ROWS;
    ctx.imageSmoothingEnabled = false;
  }

  // === GAME STATE ===
  const state = { screen: 'title', mapX: 2, mapY: 2, paused: false };

  // === INVENTORY ===
  let inventory = { H: 0, O: 0, C: 0, Na: 0, Cl: 0, Ca: 0 };
  let selectedAmmo = 'H';

  function cycleSkill() {
    if (state.screen !== 'play' || state.paused) return;
    for (let step = 1; step <= equippedSkills.length; step++) {
      const next = (selectedSkillSlot + step) % equippedSkills.length;
      const recipe = RECIPES.find(r => r.id === equippedSkills[next]);
      if (!recipe) continue;
      selectedSkillSlot = next;
      updateHUD();
      showToast(`選中技能：${recipe.name}（X 施放）`);
      return;
    }
    showToast('技能尚未解鎖：請到選單 → 背包合成化合物');
  }

  // === DROPS ===
  function updateDrops(dt) {
    const room = rooms[state.mapY][state.mapX];
    for (let i = room.drops.length - 1; i >= 0; i--) {
      const d = room.drops[i];
      d.life -= dt;
      if (d.life <= 0) { room.drops.splice(i, 1); continue; }
      const dx = player.x - d.x;
      const dy = player.y - d.y;
      if (Math.sqrt(dx * dx + dy * dy) < 0.8) {
        inventory[d.sym] = (inventory[d.sym] || 0) + 1;
        room.drops.splice(i, 1);
        playTone(660, 'sine', 0.05);
        showToast(`+1 ${d.sym}`);
        updateElemBar();
        updateHUD();
      }
    }
  }

  function drawDrops() {
    const room = rooms[state.mapY][state.mapX];
    room.drops.forEach(d => {
      const px = d.x * tileSize;
      const py = d.y * tileSize;
      const bounce = Math.sin(Date.now() / 200 + d.x * 3) * 3;
      const el = ELEMENTS.find(e => e.sym === d.sym);
      // Glow
      ctx.fillStyle = el ? el.color + '40' : '#ffffff40';
      ctx.beginPath(); ctx.arc(px, py + bounce, tileSize * 0.35, 0, Math.PI * 2); ctx.fill();
      // Letter
      ctx.fillStyle = el ? el.color : '#fff';
      ctx.font = `bold ${tileSize * 0.5}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.sym, px, py + bounce);
    });
  }

  // === PROJECTILES ===
  let projectiles = [];

  function shootProjectile() {
    if (state.screen !== 'play' || state.paused) return;
    if (inventory[selectedAmmo] <= 0) {
      showToast(`${selectedAmmo} 彈藥不足，點擊元素欄切換彈藥`);
      return;
    }
    inventory[selectedAmmo]--;
    player.shotTimer = 0.13;
    updateElemBar();
    const el = ELEMENTS.find(e => e.sym === selectedAmmo);
    const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    const [vx, vy] = dirs[player.dir];
    projectiles.push({
      x: player.x, y: player.y, vx: vx * el.speed, vy: vy * el.speed,
      dmg: player.atk * el.dmgMul, fromPlayer: true, element: el, life: 2.5,
      pierce: el.fx === 'pierce'
    });
    playTone(500, 'sine', 0.05);
  }

  function updateProjectiles(dt) {
    const room = rooms[state.mapY][state.mapX];
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const p = projectiles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      // Wall collision
      if (p.life <= 0 || isSolid(Math.floor(p.x), Math.floor(p.y))) {
        projectiles.splice(i, 1); continue;
      }
      if (p.fromPlayer) {
        // Hit monsters
        for (let j = room.monsters.length - 1; j >= 0; j--) {
          const m = room.monsters[j];
          const dx = m.x - p.x, dy = m.y - p.y;
          if (Math.sqrt(dx * dx + dy * dy) < 0.6) {
            m.hp -= p.dmg;
            // Special effects
            if (p.element.fx === 'knockback') {
              const kd = Math.sqrt(dx * dx + dy * dy) || 1;
              m.x += (dx / kd) * 2; m.y += (dy / kd) * 2;
            }
            if (p.element.fx === 'dot') m.dotTimer = 3;
            if (m.hp <= 0) killMonster(room, j);
            else playTone(400, 'triangle', 0.04);
            if (!p.pierce) { projectiles.splice(i, 1); break; }
          }
        }
      } else {
        // Enemy projectile hits player
        const dx = player.x - p.x, dy = player.y - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < 0.6) {
          damagePlayer(p.dmg);
          projectiles.splice(i, 1);
        }
      }
    }
  }

  function drawProjectiles() {
    projectiles.forEach(p => {
      const px = p.x * tileSize, py = p.y * tileSize;
      // Boss fire retains its labelled shape so hostile shots stay distinguishable.
      if (p.fromPlayer && drawCombat(AMMO_FRAME[p.element.sym], px, py,
        tileSize * 1.13, Math.atan2(p.vy, p.vx))) return;
      ctx.fillStyle = p.element.color;
      ctx.beginPath(); ctx.arc(px, py, tileSize * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${tileSize * 0.25}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.element.sym, px, py);
    });
  }

  // === HUD UPDATE ===
  function updateHUD() {
    document.getElementById('hp-fill').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('mp-fill').style.width = `${(player.mp / player.maxMp) * 100}%`;
    document.getElementById('hud-lv').textContent = player.level;
    equippedSkills.forEach((id, i) => {
      const btn = document.getElementById('sk' + (i + 1));
      const recipe = RECIPES.find(r => r.id === id);
      btn.textContent = recipe ? `${i + 1} ${recipe.formula}` : `${i + 1} 未解鎖`;
      btn.classList.toggle('selected', i === selectedSkillSlot && !!recipe);
      btn.setAttribute('aria-pressed', String(i === selectedSkillSlot && !!recipe));
      btn.title = recipe ? `${recipe.name}｜消耗 ${recipe.mp} MP｜${recipe.desc}` : '在選單的背包中合成化合物以解鎖技能';
      btn.style.color = recipe && player.mp >= recipe.mp ? '#38bdf8' : '#94a3b8';
    });
  }

  function updateElemBar() {
    const bar = document.getElementById('elem-bar');
    bar.innerHTML = ELEMENTS.map(e =>
      `<button type="button" class="elem-slot ${e.sym === selectedAmmo ? 'active' : ''}" data-sym="${e.sym}">` +
      `<span style="color:${e.color}">${e.sym}</span>:${inventory[e.sym] || 0}</button>`
    ).join('');
    bar.querySelectorAll('.elem-slot').forEach(el => {
      el.addEventListener('click', () => {
        if (state.screen !== 'play' || state.paused) return;
        selectedAmmo = el.dataset.sym;
        updateElemBar();
        showToast(`彈藥：${selectedAmmo}（剩餘 ${inventory[selectedAmmo] || 0}）`);
      });
    });
  }

  // === MONSTERS ===
  function spawnMonsters(room, mx, my) {
    if (room.type === 'start') return;
    room.monsters = [];
    const count = room.type === 'boss' ? 1 : (room.type === 'treasure' ? 3 : 2 + Math.floor(Math.random() * 4));
    for (let i = 0; i < count; i++) {
      let col, row, attempts = 0;
      do {
        col = 2 + Math.floor(Math.random() * (COLS - 4));
        row = 2 + Math.floor(Math.random() * (ROWS - 4));
        if (++attempts > 100) break;
      } while (room.tiles[row][col] !== TILE.FLOOR);
      if (attempts > 100) continue;
      const isBoss = room.type === 'boss' && i === 0;
      const isMolecular = !isBoss && Math.random() < 0.15 && i === 0;
      const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
      const lvScale = 1 + (player.level - 1) * 0.15;
      if (isBoss) {
        room.monsters.push({ x: col + 0.5, y: row + 0.5, hp: Math.floor(80 * lvScale), maxHp: Math.floor(80 * lvScale),
          atk: Math.floor(12 * lvScale), speed: 1.5, element: el, type: 'boss',
          dotTimer: 0, frozen: 0, shootTimer: 2, dir: 'down' });
      } else if (isMolecular) {
        const recipe = RECIPES[Math.floor(Math.random() * RECIPES.length)];
        room.monsters.push({ x: col + 0.5, y: row + 0.5, hp: Math.floor(30 * lvScale), maxHp: Math.floor(30 * lvScale),
          atk: Math.floor(6 * lvScale), speed: 1.2, element: el, type: 'molecular', recipe,
          dotTimer: 0, frozen: 0 });
      } else {
        room.monsters.push({ x: col + 0.5, y: row + 0.5, hp: Math.floor(10 * lvScale), maxHp: Math.floor(10 * lvScale),
          atk: Math.floor(3 * lvScale), speed: 1.8, element: el, type: 'slime',
          dotTimer: 0, frozen: 0 });
      }
    }
  }

  function updateMonsters(dt) {
    const room = rooms[state.mapY][state.mapX];
    for (let i = room.monsters.length - 1; i >= 0; i--) {
      const m = room.monsters[i];
      // DoT
      if (m.dotTimer > 0) {
        m.dotTimer -= dt;
        m.hp -= player.atk * 0.3 * dt;
        if (m.hp <= 0) { killMonster(room, i); continue; }
      }
      // Frozen
      if (m.frozen > 0) { m.frozen -= dt; continue; }
      // Chase player
      const dx = player.x - m.x;
      const dy = player.y - m.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (smokeTimer <= 0 && dist < 8 && dist > 0.6) {
        const mx = (dx / dist) * m.speed * dt;
        const my2 = (dy / dist) * m.speed * dt;
        const nnx = m.x + mx;
        const nny = m.y + my2;
        if (!isSolid(Math.floor(nnx), Math.floor(m.y))) m.x = nnx;
        if (!isSolid(Math.floor(m.x), Math.floor(nny))) m.y = nny;
      }
      // Contact damage
      if (dist < 0.7 && player.invincible <= 0) {
        damagePlayer(m.atk);
      }
      // Boss shoots
      if (m.type === 'boss') {
        m.shootTimer = (m.shootTimer || 0) - dt;
        if (m.shootTimer <= 0 && dist < 10) {
          m.shootTimer = 2.5;
          const angle = Math.atan2(dy, dx);
          projectiles.push({ x: m.x, y: m.y, vx: Math.cos(angle) * 4,
            vy: Math.sin(angle) * 4, dmg: m.atk, fromPlayer: false, element: m.element, life: 3, pierce: false });
        }
      }
    }
  }

  function drawMonsters() {
    const room = rooms[state.mapY][state.mapX];
    room.monsters.forEach(m => {
      const px = m.x * tileSize;
      const py = m.y * tileSize;
      const radius = m.type === 'boss' ? tileSize * 0.65 : (m.type === 'molecular' ? tileSize * 0.5 : tileSize * 0.4);
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(px, py + radius * 0.6, radius * 0.7, radius * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      // Body
      ctx.fillStyle = m.frozen > 0 ? '#93c5fd' : m.element.color;
      if (m.type === 'boss') {
        ctx.fillRect(px - radius, py - radius, radius * 2, radius * 2);
        // Flash border
        ctx.strokeStyle = Math.floor(Date.now() / 200) % 2 ? '#fbbf24' : '#ef4444';
        ctx.lineWidth = 3;
        ctx.strokeRect(px - radius, py - radius, radius * 2, radius * 2);
      } else {
        ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Symbol
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${radius * 0.9}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(m.element.sym, px, py);
      // HP bar
      if (m.hp < m.maxHp) {
        const barW = radius * 2;
        const barH = 4;
        const barX = px - radius;
        const barY = py - radius - 8;
        ctx.fillStyle = '#1e293b'; ctx.fillRect(barX, barY, barW, barH);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(barX, barY, barW * (m.hp / m.maxHp), barH);
      }
    });
  }

  function damagePlayer(amount) {
    if (player.shieldTimer > 0 || player.invincible > 0) return;
    player.hp -= amount;
    player.invincible = 0.5;
    playTone(180, 'sawtooth', 0.12);
    if (player.hp <= 0) {
      player.hp = 0;
      playerDeath();
    }
  }

  function killMonster(room, index) {
    const m = room.monsters[index];
    // Spawn drops
    if (m.type === 'molecular' && m.recipe) {
      Object.entries(m.recipe.req).forEach(([sym, count]) => {
        for (let k = 0; k < count; k++) {
          room.drops.push({ x: m.x + (Math.random() - 0.5) * 0.8, y: m.y + (Math.random() - 0.5) * 0.8, sym, life: 15 });
        }
      });
    } else if (m.type === 'boss') {
      const count = 3 + Math.floor(Math.random() * 3);
      for (let j = 0; j < count; j++) {
        const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
        room.drops.push({ x: m.x + (Math.random() - 0.5), y: m.y + (Math.random() - 0.5), sym: el.sym, life: 30 });
      }
    } else {
      room.drops.push({ x: m.x, y: m.y, sym: m.element.sym, life: 15 });
    }
    // EXP
    const expGain = m.type === 'boss' ? 100 : (m.type === 'molecular' ? 30 : 10 + Math.floor(Math.random() * 11));
    gainExp(expGain);
    window._stats.totalKills = (window._stats.totalKills || 0) + 1;
    const wasBoss = m.type === 'boss';
    room.monsters.splice(index, 1);
    playTone(520, 'sine', 0.08);
    saveGame();
    if (wasBoss) bossVictory();
  }

  // === MELEE ATTACK ===
  function meleeAttack() {
    if (player.atkTimer > 0) return;
    player.atkTimer = 0.3;
    player.attackDir = player.dir;
    playTone(300, 'square', 0.06);
    const room = rooms[state.mapY][state.mapX];
    const angles = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 };
    const atkAngle = angles[player.dir];
    for (let i = room.monsters.length - 1; i >= 0; i--) {
      const m = room.monsters[i];
      const dx = m.x - player.x;
      const dy = m.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 1.8) continue;
      const angle = Math.atan2(dy, dx);
      let diff = angle - atkAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) < 0.8) {
        m.hp -= player.atk;
        if (m.hp <= 0) killMonster(room, i);
        else playTone(400, 'triangle', 0.04);
      }
    }
    // Break rocks
    const dxDir = { up: 0, down: 0, left: -1, right: 1 };
    const dyDir = { up: -1, down: 1, left: 0, right: 0 };
    const rc = Math.floor(player.x + dxDir[player.dir]);
    const rr = Math.floor(player.y + dyDir[player.dir]);
    if (rc >= 0 && rc < COLS && rr >= 0 && rr < ROWS && room.tiles[rr][rc] === TILE.ROCK) {
      room.tiles[rr][rc] = TILE.FLOOR;
      if (Math.random() < 0.3) {
        const el = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
        room.drops.push({ x: rc + 0.5, y: rr + 0.5, sym: el.sym, life: 15 });
      }
    }
  }

  // === EXP & LEVEL UP ===
  function gainExp(amount) {
    player.exp += amount;
    checkLevelUp();
  }

  function checkLevelUp() {
    let needed = player.level * player.level * 50;
    while (player.exp >= needed) {
      player.level++;
      player.maxHp += 10; player.maxMp += 5; player.atk += 2;
      player.hp = player.maxHp; player.mp = player.maxMp;
      showToast(`升級！Lv.${player.level}`);
      needed = player.level * player.level * 50;
    }
  }

  // === PLAYER DEATH ===
  function playerDeath() {
    state.screen = 'dead';
    window._stats.deaths = (window._stats.deaths || 0) + 1;
    saveGame();
    document.getElementById('death-modal').classList.add('open');
  }

  // === TOAST ===
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  // === AUDIO ===
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type = 'sine', dur = 0.08) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) { /* audio not available */ }
  }

  // === GAME LOOP ===
  let lastTime = 0;
  function gameLoop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (state.screen === 'play' && !state.paused) {
      update(dt);
    }
    render();
    requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    updatePlayer(dt);
    if (keys.attack) { meleeAttack(); keys.attack = false; }
    if (keys.shoot) { shootProjectile(); keys.shoot = false; }
    updateMonsters(dt);
    updateDrops(dt);
    updateProjectiles(dt);
    updateTraps(dt);
    // MP regeneration
    player.mp = Math.min(player.maxMp, player.mp + 1.5 * dt);
    updateHUD();
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.screen === 'play') {
      // Follow the player while keeping the viewport inside the room.
      const cameraX = Math.max(0, Math.min(player.x * tileSize - canvas.width / 2, COLS * tileSize - canvas.width));
      const cameraY = Math.max(0, Math.min(player.y * tileSize - canvas.height / 2, ROWS * tileSize - canvas.height));
      ctx.save();
      ctx.translate(-Math.round(cameraX), -Math.round(cameraY));
      drawRoom();
      drawMonsters();
      drawDrops();
      drawTrapsAndZones();
      drawCastVisuals();
      drawProjectiles();
      drawPlayer();
      ctx.restore();
      drawMinimap();
    }
  }

  // === KEYBOARD INPUT ===
  window.addEventListener('keydown', (e) => {
    if (state.screen !== 'play' || state.paused) return;
    const actionKey = ({ KeyC: 'c', KeyX: 'x', Digit1: '1', Digit2: '2', Digit3: '3', Digit4: '4',
      Numpad1: '1', Numpad2: '2', Numpad3: '3', Numpad4: '4' })[e.code] || e.key;
    if (['c', 'x', '1', '2', '3', '4', ' '].includes(actionKey)) {
      e.preventDefault();
      if (e.repeat) return;
    }
    switch (actionKey) {
      case 'ArrowUp': case 'w': case 'W': keys.up = true; break;
      case 'ArrowDown': case 's': case 'S': keys.down = true; break;
      case 'ArrowLeft': case 'a': case 'A': keys.left = true; break;
      case 'ArrowRight': case 'd': case 'D': keys.right = true; break;
      case 'z': case 'Z': case ' ': keys.attack = true; break;
      case 'x': case 'X': useSkill(selectedSkillSlot); break;
      case 'c': case 'C': cycleSkill(); break;
      case '1': useSkill(0); break;
      case '2': useSkill(1); break;
      case '3': useSkill(2); break;
      case '4': useSkill(3); break;
    }
  });
  window.addEventListener('keyup', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': keys.up = false; break;

  // === SKILLS ===
  let traps = [];
  let smokeTimer = 0;
  let acidZones = [];
  let castVisuals = [];
  // Visual-only timing: damage, MP costs and effect duration still come from useSkill / updateTraps.
  const CAST_ART = {
    heal: { frame: 11, radius: 0.95, time: 0.55 },
    aoe: { frame: 7, radius: 3, time: 0.42 },
    smoke: { color: '#94a3b8', radius: 2, time: 0.7 },
    shield: { color: '#e7c69a', radius: 0.85, time: 2, follow: true },
    explode: { frame: 8, radius: 5, time: 0.55 },
    freeze: { frame: 9, radius: 4, time: 0.58 }
  };

  function drawCastVisuals() {
    castVisuals.forEach(fx => {
      const progress = 1 - fx.life / fx.time;
      const x = (fx.follow ? player.x : fx.x) * tileSize;
      const y = (fx.follow ? player.y : fx.y) * tileSize;
      const radius = fx.radius * tileSize * (fx.follow ? 1 : 0.44 + progress * 0.56);
      const opacity = fx.follow ? Math.min(0.85, fx.life * 3) : Math.min(0.9, (1 - progress) * 2.4);
      if (fx.frame !== undefined && drawCombat(fx.frame, x, y, radius * 2.25, 0, opacity)) return;
      ctx.save();
      ctx.globalAlpha = opacity * 0.6;
      ctx.strokeStyle = fx.color || '#c4e9ff';
      ctx.lineWidth = Math.max(1, Math.round(tileSize / 12));
      ctx.setLineDash([Math.max(2, tileSize / 6), Math.max(2, tileSize / 9)]);
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });
  }

  function useSkill(slotIdx) {
    if (state.screen !== 'play' || state.paused) return;
    const skillId = equippedSkills[slotIdx];
    if (!skillId) {
      showToast('技能尚未解鎖：請到選單 → 背包合成化合物');
      return;
    }
    const recipe = RECIPES.find(r => r.id === skillId);
    if (!recipe) return;
    selectedSkillSlot = slotIdx;
    updateHUD();
    if (player.mp < recipe.mp) {
      showToast(`MP 不足：${recipe.name}需要 ${recipe.mp} MP`);
      return;
    }
    player.mp -= recipe.mp;
    updateHUD();
    playTone(600, 'sine', 0.1);
    const art = CAST_ART[recipe.skill];
    if (art) castVisuals.push({ ...art, x: player.x, y: player.y, life: art.time });

    const room = rooms[state.mapY][state.mapX];
    switch (recipe.skill) {
      case 'heal':
        player.hp = Math.min(player.maxHp, player.hp + Math.floor(player.maxHp * 0.3));
        showToast('淨化之水：HP 回復！');
        break;
      case 'aoe': {
        const dmg = player.atk * 3;
        room.monsters.forEach(m => {
          const dist = Math.sqrt((m.x - player.x) ** 2 + (m.y - player.y) ** 2);
          if (dist < 3) m.hp -= dmg;
        });
        for (let i = room.monsters.length - 1; i >= 0; i--) {
          if (room.monsters[i].hp <= 0) killMonster(room, i);
        }
        showToast('結晶爆破！');
        break;
      }
      case 'smoke':
        smokeTimer = 3;
        showToast('煙霧彈：怪物暫時失明！');
        break;
      case 'trap':
        traps.push({ x: player.x, y: player.y, life: 8, dmg: player.atk * 0.5 });
        showToast('腐蝕陷阱已放置！');
        break;
      case 'shield':
        player.shieldTimer = 2;
        showToast('石盾：無敵 2 秒！');
        break;
      case 'explode': {
        const dmg2 = player.atk * 5;
        room.monsters.forEach(m => {
          const dist = Math.sqrt((m.x - player.x) ** 2 + (m.y - player.y) ** 2);
          if (dist < 5) m.hp -= dmg2;
        });
        for (let i = room.monsters.length - 1; i >= 0; i--) {
          if (room.monsters[i].hp <= 0) killMonster(room, i);
        }
        showToast('甲烷爆炸！！！');
        break;
      }
      case 'freeze':
        room.monsters.forEach(m => {
          const dist = Math.sqrt((m.x - player.x) ** 2 + (m.y - player.y) ** 2);
          if (dist < 4) m.frozen = 2;
        });
        showToast('急凍結晶！');
        break;
      case 'acid':
        acidZones.push({ x: player.x, y: player.y, dir: player.dir, life: 3, dmg: player.atk * 0.8 });
        showToast('酸霧噴射！');
        break;
    }
    saveGame();
  }

  function updateTraps(dt) {
    for (let i = castVisuals.length - 1; i >= 0; i--) {
      castVisuals[i].life -= dt;
      if (castVisuals[i].life <= 0) castVisuals.splice(i, 1);
    }
    const room = rooms[state.mapY][state.mapX];
    for (let i = traps.length - 1; i >= 0; i--) {
      traps[i].life -= dt;
      if (traps[i].life <= 0) { traps.splice(i, 1); continue; }
      room.monsters.forEach(m => {
        const dist = Math.sqrt((m.x - traps[i].x) ** 2 + (m.y - traps[i].y) ** 2);
        if (dist < 0.8) m.hp -= traps[i].dmg * dt;
      });
      for (let j = room.monsters.length - 1; j >= 0; j--) {
        if (room.monsters[j].hp <= 0) killMonster(room, j);
      }
    }
    // Acid zones
    for (let i = acidZones.length - 1; i >= 0; i--) {
      acidZones[i].life -= dt;
      if (acidZones[i].life <= 0) { acidZones.splice(i, 1); continue; }
      const az = acidZones[i];
      const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [adx, ady] = dirs[az.dir];
      room.monsters.forEach(m => {
        const relX = m.x - az.x, relY = m.y - az.y;
        const proj = relX * adx + relY * ady;
        if (proj > 0 && proj < 3) {
          const perp = Math.abs(relX * ady - relY * adx);
          if (perp < 1.5) m.hp -= az.dmg * dt;
        }
      });
      for (let j = room.monsters.length - 1; j >= 0; j--) {
        if (room.monsters[j].hp <= 0) killMonster(room, j);
      }
    }
    // Smoke timer
    if (smokeTimer > 0) smokeTimer -= dt;
  }

  function drawTrapsAndZones() {
    traps.forEach(t => {
      ctx.fillStyle = `rgba(34, 197, 94, ${0.3 + Math.sin(Date.now() / 200) * 0.15})`;
      ctx.beginPath(); ctx.arc(t.x * tileSize, t.y * tileSize, tileSize * 0.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.font = `${tileSize * 0.3}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\u2620', t.x * tileSize, t.y * tileSize);
    });
    acidZones.forEach(az => {
      const angle = DIR_ANGLE[az.dir];
      if (drawCombat(10, (az.x + Math.cos(angle) * 1.5) * tileSize,
        (az.y + Math.sin(angle) * 1.5) * tileSize, 3.5 * tileSize, angle, Math.min(0.85, az.life))) return;
      const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const [adx, ady] = dirs[az.dir];
      ctx.fillStyle = `rgba(163, 230, 53, ${0.2 + Math.sin(Date.now() / 150) * 0.1})`;
      ctx.beginPath();
      ctx.moveTo(az.x * tileSize, az.y * tileSize);
      ctx.lineTo((az.x + adx * 3 + ady * 1.5) * tileSize, (az.y + ady * 3 + adx * 1.5) * tileSize);
      ctx.lineTo((az.x + adx * 3 - ady * 1.5) * tileSize, (az.y + ady * 3 - adx * 1.5) * tileSize);
      ctx.closePath(); ctx.fill();
    });
  }

  function synthesize(recipeId) {
    const recipe = RECIPES.find(r => r.id === recipeId);
    if (!recipe) return;
    // Check inventory
    for (const [sym, count] of Object.entries(recipe.req)) {
      if ((inventory[sym] || 0) < count) return;
    }
    // Consume
    for (const [sym, count] of Object.entries(recipe.req)) inventory[sym] -= count;
    // Unlock
    const firstTime = !codex.includes(recipeId);
    if (firstTime) {
      codex.push(recipeId);
      unlockedSkills.push(recipeId);
      // Auto-equip to first empty slot
      const emptySlot = equippedSkills.indexOf(null);
      if (emptySlot >= 0) equippedSkills[emptySlot] = recipeId;
      gainExp(recipe.pts);
      showToast(`圖鑑解鎖：${recipe.formula} ${recipe.name}！`);
    } else {
      gainExp(50);
      showToast(`合成 ${recipe.formula} +50 EXP`);
    }
    updateElemBar();
    updateHUD();
    saveGame();
    renderInventoryTab();
    renderCodexTab();
  }

  // === VIRTUAL JOYSTICK ===
  const joyCanvas = document.getElementById('joystick');

  function drawJoystick() {
    joyCtx.clearRect(0, 0, 120, 120);
    // Base circle
    joyCtx.strokeStyle = '#334155'; joyCtx.lineWidth = 2;
    joyCtx.beginPath(); joyCtx.arc(60, 60, 50, 0, Math.PI * 2); joyCtx.stroke();
    // Thumb
    const tx = 60 + joyX * 30, ty = 60 + joyY * 30;
    joyCtx.fillStyle = '#38bdf8';
    joyCtx.beginPath(); joyCtx.arc(tx, ty, 18, 0, Math.PI * 2); joyCtx.fill();
  }
  drawJoystick();

  function handleJoyTouch(e) {
    e.preventDefault();
    const rect = joyCanvas.getBoundingClientRect();
    const touch = e.touches[0];
    const dx = (touch.clientX - rect.left - 60) / 50;
    const dy = (touch.clientY - rect.top  - 60) / 50;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 1) { joyX = dx / len; joyY = dy / len; }
    else          { joyX = dx;      joyY = dy; }
    keys.left  = joyX < -0.3; keys.right = joyX > 0.3;
    keys.up    = joyY < -0.3; keys.down  = joyY > 0.3;
    if (Math.abs(joyX) > Math.abs(joyY)) player.dir = joyX > 0 ? 'right' : 'left';
    else if (Math.abs(joyY) > 0.3)       player.dir = joyY > 0 ? 'down'  : 'up';
    drawJoystick();
  }

  joyCanvas.addEventListener('touchstart', (e) => { joyActive = true; handleJoyTouch(e); }, { passive: false });
  joyCanvas.addEventListener('touchmove', handleJoyTouch, { passive: false });
  joyCanvas.addEventListener('touchend', () => {
    joyActive = false; joyX = 0; joyY = 0;
    keys.left = keys.right = keys.up = keys.down = false;
    drawJoystick();
  });

    const ms = 8;

    const oy = 8;
    ctx.fillStyle = 'rgba(15,23,42,0.8)';
    ctx.fillRect(ox - 2, oy - 2, MAP_W * ms + 4, MAP_H * ms + 4);
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const room = rooms[y][x];
        if (x === state.mapX && y === state.mapY) {
          ctx.fillStyle = '#38bdf8';
        } else if (!room.generated) {
          ctx.fillStyle = '#1e293b';
        } else if (room.type === 'boss') {
          ctx.fillStyle = '#dc2626';
        } else if (room.type === 'treasure') {
          ctx.fillStyle = '#fbbf24';
        } else {
          ctx.fillStyle = '#334155';
        }
        ctx.fillRect(ox + x * ms, oy + y * ms, ms - 1, ms - 1);
      }
    }
  }

  // === TITLE STATS ===
  function updateTitleStats() {
    const el = document.getElementById('title-stats');
    if (!el) return;
    const totalElems = Object.values(inventory).reduce((a, b) => a + b, 0);
    el.textContent = `Lv.${player.level} ｜ 圖鑑 ${codex.length}/${RECIPES.length} ｜ 元素 ${totalElems} 個`;
  }

  // === INIT ===
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  loadGame();
  updateTitleStats();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
